<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> to do app list</title>
    <style>
        body{
            background-color: rgb(68, 61, 61);
        }
        .container{
            background-color: rgb(61, 38, 38);
            width: 80%;
            margin: auto;
            height: 100vh;
            color: whitesmoke;
            padding: 20px;

        }
        .container input{
            padding: 8px;
            width: 240px;
            border: none;
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
        }
        #addTaskButton{
            padding: 8px;
            border: none;
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
            background-color: green;
            color: whitesmoke;
            cursor: pointer;

        }
        #addTaskButton:hover{
            background-color: rgb(57, 168, 57);
        }

        #todo-list{
            padding: 10px;
            list-style-type: none;
        }
        #todo-list li{
              background-color: rgb(82, 76, 76);
              margin-bottom: 5px;
              padding: 5px;
              display: flex;
              justify-content: space-between;
              cursor: pointer;
        }
        #todo-list li button{
            background-color: rgba(167, 6, 6, 0.774);
            color: whitesmoke;
            border: none;
            padding: 5px;
            cursor: pointer;
        }
        .completed span{
            text-decoration: line-through;
            opacity: 0.6;
        }
    </style>
</head>
<body>
     <div class="container">
        <h2> TO DO APP</h2>
        <div>
            <input type="text" name="" id="taskInput" placeholder="add your task">
            <button id="addTaskButton" > Add Task</button>
        </div>
        <ul id="todo-list">
        </ul>

     </div>
     <script src="script1.js"></script>
</body>
</html>
